# Fly.io config for the Forex Alchemist Discord bot.
# The bot is a long-running worker (no HTTP) so we disable services & request
# a small always-on machine.
app = "forex-alchemist-bot"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  TIMEZONE = "UTC"
  LOG_LEVEL = "INFO"

[processes]
  bot = "alchemist-bot"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
